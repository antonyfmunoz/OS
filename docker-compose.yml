# NOTE: top-level env_file is not valid in compose.
# Each service declares its own env_file below.

networks:
  eos_network:
    driver: bridge

services:
  os-scraper:
    build: .
    container_name: os-scraper
    restart: "no"
    working_dir: /app
    command: python3 services/overnight_scrape.py
    networks:
      - eos_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${UMH_ROOT:-/opt/OS}:/app
    env_file:
      - services/.env
      - infra/docker/umh.env
    environment:
      - PYTHONPATH=/app
      - UMH_ROOT=/app
      - TZ=America/Los_Angeles
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  os-webhook:
    build: .
    container_name: os-webhook
    restart: always
    working_dir: /app
    command: python3 transports/api/webhooks/calendly_webhook.py
    networks:
      - eos_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${UMH_ROOT:-/opt/OS}:/app
    env_file:
      - services/.env
      - infra/docker/umh.env
    environment:
      - PYTHONPATH=/app
      - UMH_ROOT=/app
      - TZ=America/Los_Angeles
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    ports:
      - "127.0.0.1:8080:8080"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  os-discord:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: os-discord
    restart: on-failure
    working_dir: /app
    # network_mode: host was removed — Discord bot only makes outbound HTTPS
    # calls to discord.com. Bridge networking provides full internet access.
    networks:
      - eos_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ${UMH_ROOT:-/opt/OS}:/app
      - ${UMH_ROOT:-/opt/OS}/logs:${UMH_ROOT:-/opt/OS}/logs
      - /root/.config/gws:/root/.config/gws
      - /root/.config/@googleworkspace:/root/.config/@googleworkspace
      - /root/.claude:/root/.claude:ro
      - /root/.claude.json:/root/.claude.json:ro
      # Host tmux socket — lets the router's claude_cli backend reach the
      # host's `dex_main` Claude Code session from inside the container.
      # Host server lives at /tmp/tmux-0/default (root UID 0); container is
      # also root so the default socket path resolves identically.
      - /tmp/tmux-0:/tmp/tmux-0
    env_file:
      - services/.env
      - infra/docker/umh.env
    environment:
      - PYTHONPATH=/app
      - UMH_ROOT=/app
      - TZ=America/Los_Angeles
      - PYTHONUNBUFFERED=1
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OTEL_TRACES_EXPORTER=none
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
      - ANTHROPIC_DISABLE_TELEMETRY=1
      - CC_SDK_TIMEOUT_SECONDS=180

      - UMH_ROUTER_CLAUDE_CLI_ENABLED=1
      - UMH_ROUTER_CLAUDE_CLI_TARGET=vps
      - UMH_ROUTER_CLAUDE_CLI_SESSION=dex_main
      # Force default tmux socket dir so container tmux binds to the mounted
      # host socket rather than a container-private one.
      - TMUX_TMPDIR=/tmp

      - EOS_DISCORD_TEXT_TRANSPORT_ENABLED=1
      - EOS_DISCORD_TEXT_REPLY_TTS_ENABLED=1
      - EOS_DISCORD_TEXT_ALLOWED_GUILDS=*
      - EOS_DISCORD_TEXT_ALLOWED_CHANNELS=*
      - EOS_DISCORD_TEXT_ALLOWED_USERS=${FOUNDER_DISCORD_ID:-*}
    command: python3 services/discord_bot.py
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.35"

  os-livekit:
    image: livekit/livekit-server:v1.8.3
    container_name: os-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    networks:
      - eos_network
    ports:
      - "7880:7880"
      - "7881:7881"
      - "3478:3478/udp"
      - "50000-50020:50000-50020/udp"
    volumes:
      - ./infra/livekit.yaml:/etc/livekit.yaml:ro
    env_file:
      - services/.env
    deploy:
      resources:
        limits:
          cpus: "0.35"
          memory: 256M

  os-neko:
    image: ghcr.io/m1k1o/neko/chromium:latest
    container_name: os-neko
    restart: unless-stopped
    shm_size: "2g"
    cap_add:
      - SYS_ADMIN
    networks:
      - eos_network
    ports:
      - "127.0.0.1:8085:8080"
      - "52000-52100:52000-52100/udp"
    environment:
      - NEKO_DESKTOP_SCREEN=1920x1080@30
      - NEKO_MEMBER_MULTIUSER_USER_PASSWORD=${NEKO_USER_PASSWORD:-neko}
      - NEKO_MEMBER_MULTIUSER_ADMIN_PASSWORD=${NEKO_ADMIN_PASSWORD:-admin}
      - NEKO_WEBRTC_ICELITE=true
      - NEKO_WEBRTC_NAT1TO1=157.173.212.126
      - NEKO_WEBRTC_EPHEMERAL_MIN=52000
      - NEKO_WEBRTC_EPHEMERAL_MAX=52100
      - NEKO_SERVER_CORS=https://universalmetaharness.tech,https://umh-cockpit.fly.dev
      - NEKO_SERVER_PROXY=true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 1G

  os-operator:
    build: .
    container_name: os-operator
    restart: unless-stopped
    working_dir: /app
    command: python3 -m uvicorn services.operator_api:app --host 0.0.0.0 --port 8091
    networks:
      - eos_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${UMH_ROOT:-/opt/OS}:/app
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /root/.ssh/id_ed25519:/run/secrets/mesh_key:ro
      - /root/.ssh/known_hosts:/root/.ssh/known_hosts:ro
      - /var/lib/umh/rooms:/var/lib/umh/rooms
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock:ro
    env_file:
      - services/.env
      - infra/docker/umh.env
    environment:
      - PYTHONPATH=/app
      - UMH_ROOT=/app
      - TZ=America/Los_Angeles
      - PYTHONUNBUFFERED=1
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - VOICE_WS_UPSTREAM=ws://host.docker.internal:8096/voice
      - UMH_MESH_RELAY_HOST=host.docker.internal
      - UMH_ROUTER_CLAUDE_CLI_ENABLED=0
      - LIVEKIT_URL=ws://os-livekit:7880
    ports:
      - "127.0.0.1:8091:8091"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
