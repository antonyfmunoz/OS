# NOTE: top-level env_file is not valid in compose.
# Each service declares its own env_file below.

networks:
  eos_network:
    driver: bridge

services:
  os-scraper:
    build: .
    container_name: os-scraper
    restart: "no"
    working_dir: /app
    command: python3 services/overnight_scrape.py
    networks:
      - eos_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${UMH_ROOT:-/opt/OS}:/app
    env_file:
      - services/.env
      - infra/docker/umh.env
    environment:
      - PYTHONPATH=/app
      - UMH_ROOT=/app
      - TZ=America/Los_Angeles
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  os-webhook:
    build: .
    container_name: os-webhook
    restart: always
    working_dir: /app
    command: python3 transports/api/webhooks/calendly_webhook.py
    networks:
      - eos_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${UMH_ROOT:-/opt/OS}:/app
    env_file:
      - services/.env
      - infra/docker/umh.env
    environment:
      - PYTHONPATH=/app
      - UMH_ROOT=/app
      - TZ=America/Los_Angeles
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    ports:
      - "127.0.0.1:8080:8080"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  os-discord:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: os-discord
    restart: on-failure
    working_dir: /app
    # network_mode: host was removed — Discord bot only makes outbound HTTPS
    # calls to discord.com. Bridge networking provides full internet access.
    networks:
      - eos_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ${UMH_ROOT:-/opt/OS}:/app
      - ${UMH_ROOT:-/opt/OS}/logs:${UMH_ROOT:-/opt/OS}/logs
      - /root/.config/gws:/root/.config/gws
      - /root/.config/@googleworkspace:/root/.config/@googleworkspace
      - /root/.claude:/root/.claude:ro
      - /root/.claude.json:/root/.claude.json:ro
      # Host tmux socket — lets the router's claude_cli backend reach the
      # host's `dex_main` Claude Code session from inside the container.
      # Host server lives at /tmp/tmux-0/default (root UID 0); container is
      # also root so the default socket path resolves identically.
      - /tmp/tmux-0:/tmp/tmux-0
    env_file:
      - services/.env
      - infra/docker/umh.env
    environment:
      - PYTHONPATH=/app
      - UMH_ROOT=/app
      - TZ=America/Los_Angeles
      - PYTHONUNBUFFERED=1
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OTEL_TRACES_EXPORTER=none
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
      - ANTHROPIC_DISABLE_TELEMETRY=1
      - CC_SDK_TIMEOUT_SECONDS=180

      - UMH_ROUTER_CLAUDE_CLI_ENABLED=1
      - UMH_ROUTER_CLAUDE_CLI_TARGET=vps
      - UMH_ROUTER_CLAUDE_CLI_SESSION=dex_main
      # Force default tmux socket dir so container tmux binds to the mounted
      # host socket rather than a container-private one.
      - TMUX_TMPDIR=/tmp

      - EOS_DISCORD_TEXT_TRANSPORT_ENABLED=1
      - EOS_DISCORD_TEXT_REPLY_TTS_ENABLED=1
      - EOS_DISCORD_TEXT_ALLOWED_GUILDS=*
      - EOS_DISCORD_TEXT_ALLOWED_CHANNELS=*
      - EOS_DISCORD_TEXT_ALLOWED_USERS=${FOUNDER_DISCORD_ID:-*}
    command: python3 services/discord_bot.py
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.35"

  os-livekit:
    image: livekit/livekit-server:v1.8.3
    container_name: os-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    networks:
      - eos_network
    ports:
      - "7880:7880"
      - "7881:7881"
      - "3478:3478/udp"
      - "50000-50020:50000-50020/udp"
    volumes:
      - ./infra/livekit.yaml:/etc/livekit.yaml:ro
    env_file:
      - services/.env
    deploy:
      resources:
        limits:
          cpus: "0.35"
          memory: 256M

  os-browser:
    build: .
    container_name: os-browser
    restart: unless-stopped
    working_dir: /app
    command: python3 services/browser_relay.py
    shm_size: "512m"
    networks:
      - eos_network
    volumes:
      - ${UMH_ROOT:-/opt/OS}:/app
    env_file:
      - services/.env
    environment:
      - PYTHONPATH=/app
      - UMH_ROOT=/app
      - PYTHONUNBUFFERED=1
      - PLAYWRIGHT_BROWSERS_PATH=/root/.cache/ms-playwright
    ports:
      - "127.0.0.1:8086:8086"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 1280M

  os-operator:
    build: .
    container_name: os-operator
    restart: unless-stopped
    working_dir: /app
    command: python3 -m uvicorn services.operator_api:app --host 0.0.0.0 --port 8091
    networks:
      - eos_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${UMH_ROOT:-/opt/OS}:/app:ro
      - ${UMH_OPERATOR_STATE_DIR:-/var/lib/umh/operator/state/live}:/state/umh
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /root/.ssh/id_ed25519:/run/secrets/mesh_key:ro
      - /root/.ssh/known_hosts:/root/.ssh/known_hosts:ro
      - /var/lib/umh/rooms:/var/lib/umh/rooms
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock:ro
      - /tmp/tmux-0:/tmp/tmux-0
    env_file:
      - services/.env
      - infra/docker/umh.env
    environment:
      - PYTHONPATH=/app
      - UMH_ROOT=/app
      - UMH_STATE_DIR=/state/umh
      - UMH_REQUIRE_STATE_DIR=1
      - TZ=America/Los_Angeles
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      # This workspace's DECLARED writable-path authority (worktree-relative,
      # least-privilege). Every Task materialized here carries exactly this
      # scope on its contract, and verification enforces it. Materialization
      # fails CLOSED without a declaration — an undeclared scope is never
      # whole-repository permission. Widen deliberately, never with '.' or an
      # absolute path (both are refused by the WorkRequirements contract).
      - UMH_WORKSPACE_WRITABLE_PATHS=substrate,transports,adapters,services,projections,scripts,tests,docs,data
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - UMH_MESH_RELAY_HOST=host.docker.internal
      - UMH_ROUTER_CLAUDE_CLI_ENABLED=0
      - LIVEKIT_URL=ws://os-livekit:7880
      # 1Password-runtime-injected (op run at compose time) — never a plaintext file value.
      # Empty when not injected -> EOS read surfaces stay env-disabled-safe (fail-closed).
      - EOS_DATABASE_URL=${EOS_DATABASE_URL:-}
      # Mesh relay auth + verdict signing — empty when not injected keeps the
      # dispatch path fail-closed (relay refuses, verdict signer raises).
      - UMH_MESH_RELAY_SECRET=${UMH_MESH_RELAY_SECRET:-}
      - UMH_MESH_VERDICT_SECRET=${UMH_MESH_VERDICT_SECRET:-}
    ports:
      - "127.0.0.1:8091:8091"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          # 1G caused cgroup thrash: idle RES is ~940MiB, so sustained cockpit
          # polling pinned the cap (>1M major faults, all reads wedged —
          # 2026-07-07 post-#228 load watch). 2G gives real headroom; host has 16G.
          memory: 2G
