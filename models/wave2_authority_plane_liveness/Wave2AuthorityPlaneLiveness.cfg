SPECIFICATION Spec

CONSTANT
MaxBulkBacklog = 2
MaxReconBacklog = 2
MaxReconChecks = 6

INVARIANT NoExecutionWithoutAuthority

PROPERTY SafetyNeverDependsOnLivenessSuccess
PROPERTY AuthorityTrafficCannotBeStarvedByBulkTraffic
PROPERTY AuthorityTrafficCannotBeStarvedByReconciliationTraffic
PROPERTY QueuedAuthorityEventuallyReceivesServiceUnderHealthyTransport
PROPERTY TerminalResultEventuallyReceivesServiceUnderHealthyTransport
PROPERTY PersistedClaimEventuallyGetsAckOrIndependentReadbackUnderHealthyPaths
PROPERTY ReconciliationTrafficIsBounded
