SPECIFICATION Spec

CONSTANT
AuthorityCapacity = 2
BulkCapacity = 2
ReconCapacity = 2
AuthorityBurstLimit = 2
SendBound = 2
MaxReconChecks = 4
MaxTransportGeneration = 2

INVARIANT AuthorityQueueIsBounded
INVARIANT TypeOK
INVARIANT AuthorityOverflowNeverSilentlyDropsAuthority
INVARIANT NoExecutionWithoutCanonicalAuthority
INVARIANT TransportFailureCannotAuthorizeExecution
INVARIANT BothObservationPathsUnavailableNeverAllowsRunning
INVARIANT CancellationSafetyPreserved
INVARIANT ReconciliationProductionIsBounded
INVARIANT AckProofUsesExactTransportGeneration
INVARIANT AuthorityOverflowCannotPermitRunning

PROPERTY BulkTrafficCannotStarveAuthority
PROPERTY InFlightBulkSendEitherCompletesOrTransportFailsWithinBound
PROPERTY QueuedAuthorityEventuallyServicedUnderHealthyTransport
PROPERTY PersistedClaimEventuallyObservedViaAckOrReadbackUnderHealthyPaths
PROPERTY TerminalResultEventuallyServicedUnderHealthyTransport
PROPERTY TerminalResultNotLostOnTransportOverload
PROPERTY SafetyNeverDependsOnLivenessSuccess
