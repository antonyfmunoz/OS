name: Mobile Build

on:
  push:
    paths:
      - 'cockpit/**'
    branches: [main]
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cockpit/package-lock.json
      - run: cd cockpit && npm ci --legacy-peer-deps
      - run: cd cockpit && npx vite build --config vite.web.config.ts
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_URL: /api/umh
          VITE_AI_NAME: DEX
      - uses: actions/upload-artifact@v4
        with:
          name: dist-web
          path: cockpit/dist-web/

  build-ios:
    needs: build-web
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cockpit/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: dist-web
          path: cockpit/dist-web/
      - run: cd cockpit && npm ci --legacy-peer-deps
      - run: cd cockpit && npx cap sync ios
      - name: Build iOS
        run: |
          cd cockpit/ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: ${{ runner.temp }}/App.xcarchive

  build-android:
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cockpit/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: actions/download-artifact@v4
        with:
          name: dist-web
          path: cockpit/dist-web/
      - run: cd cockpit && npm ci --legacy-peer-deps
      - run: cd cockpit && npx cap sync android
      - name: Build Android APK
        run: |
          cd cockpit/android
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: cockpit/android/app/build/outputs/apk/debug/app-debug.apk
