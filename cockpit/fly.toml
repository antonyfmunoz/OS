app = "umh-cockpit"
primary_region = "sjc"

[build]
  # Tenant build args are injected at deploy time by cockpit/deploy.sh
  # (--build-arg from env / 1Password). These placeholders keep local builds
  # working without baking any tenant identity into source.
  [build.args]
    VITE_CLERK_PUBLISHABLE_KEY = ""
    VITE_AI_NAME = "Assistant"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
